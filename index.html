<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Railways KZ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background-image: url("background 4.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;
    }

    /* Круг */
    .social-circle {
      width: 280px;
      height: 280px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      border: 2px solid rgba(255, 255, 255, 0.45);

      box-shadow:
        0 0 40px rgba(255, 255, 255, 0.15),
        inset 0 0 30px rgba(255, 255, 255, 0.08);

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
    }

    /* Внешнее тонкое кольцо */
    .social-circle::before {
      content: "";
      position: absolute;

      width: 305px;
      height: 305px;

      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);

      pointer-events: none;
    }

    /* 4 иконки */
    .icons {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 18px;

      position: relative;
      z-index: 2;
    }

    .icon {
      width: 82px;
      height: 82px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background: rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      border: 1px solid rgba(255, 255, 255, 0.35);

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.25),
        inset 0 0 15px rgba(255, 255, 255, 0.12);

      transition: 0.25s ease;
    }

    .icon img {
      width: 62px;
      height: 62px;

      object-fit: contain;

      display: block;
    }

    .icon:hover {
      transform: scale(1.08);

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.35),
        0 0 20px rgba(255, 255, 255, 0.25);
    }

    /* Для телефона */
    @media (max-width: 500px) {

      .social-circle {
        width: 260px;
        height: 260px;
      }

      .social-circle::before {
        width: 285px;
        height: 285px;
      }

      .icons {
        gap: 16px;
      }

      .icon {
        width: 76px;
        height: 76px;

        border-radius: 18px;
      }

      .icon img {
        width: 57px;
        height: 57px;
      }
    }
  </style>
</head>

<body>

  <div class="social-circle">

    <div class="icons">

      <!-- Telegram -->
      <a class="icon" href="https://t.me/railways_kz" target="_blank">
        <img src="Telegram.png" alt="Telegram">
      </a>

      <!-- YouTube -->
      <a class="icon" href="https://www.youtube.com/@railwaysresmi" target="_blank">
        <img src="YouTube.png" alt="YouTube">
      </a>

      <!-- Instagram -->
      <a class="icon" href="https://instagram.com/railways.kz" target="_blank">
        <img src="Instagram.png" alt="Instagram">
      </a>

      <!-- TikTok -->
      <a class="icon" href="https://www.tiktok.com/@railwayskz" target="_blank">
        <img src="Tik-Tok.png" alt="TikTok">
      </a>

    </div>

  </div>

</body>
</html>
